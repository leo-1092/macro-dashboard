<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매크로 시장 지표 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', sans-serif; background: #f4f6fa; color: #222; font-size: 13px; }
.header {
  background: #1a1a2e; color: #fff; padding: 16px 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 18px; font-weight: 700; }
.updated { font-size: 11px; color: #aab; margin-top: 3px; }
.badge { background: #e97132; color: #fff; font-size: 11px; padding: 4px 12px; border-radius: 20px; }
.main { padding: 20px 28px; }

/* 섹션 그리드 */
.section-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.section-card {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.07);
  overflow: hidden;
}
.section-header {
  background: #1a1a2e; color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 8px 12px; letter-spacing: 0.5px;
}
.indicator-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid #f0f0f0;
}
.indicator-row:last-child { border-bottom: none; }
.ind-label { color: #555; font-size: 11px; }
.ind-value { font-weight: 700; font-size: 14px; color: #1a1a2e; }
.ind-unit  { font-size: 10px; color: #aaa; margin-left: 2px; }

/* 변화 테이블 */
.change-section { margin-bottom: 20px; }
.change-title {
  font-size: 13px; font-weight: 700; color: #1a1a2e;
  margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 2px solid #1a1a2e;
}
.change-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; background: #fff;
  border-radius: 10px; overflow: hidden; box-shadow: 0 1px 5px rgba(0,0,0,0.07); }
th { background: #f8f9fc; color: #555; font-weight: 700; padding: 8px 10px;
  text-align: center; border-bottom: 2px solid #e0e4ef; white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid #f0f0f0; text-align: right; }
td:first-child { text-align: left; color: #444; font-weight: 600; }
td:nth-child(2) { text-align: center; color: #888; font-size: 10px; }
tr:hover td { background: #fafbff; }
.up   { color: #e00; font-weight: 600; }
.down { color: #156082; font-weight: 600; }
.flat { color: #888; }

/* 차트 */
.chart-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 14px; margin-bottom: 20px;
}
.chart-card {
  background: #fff; border-radius: 10px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.07);
  padding: 14px;
}
.chart-label { font-size: 11px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
canvas { max-height: 140px; }

/* Daily Macro Brief */
.news-section { margin-bottom: 20px; }
.brief-file { display: none; }
.brief-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  margin-bottom: 16px;
}
.brief-card {
  background: #fff; border-radius: 10px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.07);
  overflow: hidden;
}
.brief-cat {
  font-size: 11px; font-weight: 700; color: #333;
  padding: 7px 12px; background: #e8e8e8;
  letter-spacing: 0.5px;
}
.brief-sentences { padding: 10px 12px; }
.brief-sent {
  font-size: 11px; color: #333; line-height: 1.75;
  padding: 5px 0; border-bottom: 1px solid #f0f0f0;
}
.brief-sent:last-child { border-bottom: none; }
.brief-sent::before { content: "•  "; color: #e97132; font-weight: 700; }
.section-divider {
  font-size: 11px; font-weight: 700; color: #888;
  letter-spacing: 1px; text-transform: uppercase;
  margin: 4px 0 10px; padding-bottom: 5px;
  border-bottom: 1px dashed #ddd;
}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>매크로 시장 지표 대시보드</h1>
    <div class="updated" id="updated-date">업데이트: --</div>
  </div>
  <div class="badge" id="badge-date">--</div>
</div>

<div class="main">
  <!-- 최신값 카드 -->
  <div class="section-divider">MARKET SNAPSHOT</div>
  <div class="section-grid" id="snapshot-grid"></div>

  <div class="section-divider">HISTORICAL CHANGE</div>
  <div class="change-section">
    <div class="change-wrap"><table id="change-table"></table></div>
  </div>

</div>

// 기간별 변화 테이블
function chgClass(v, base) {
  if (base == null || v == null) return 'flat';
  const d = v - base;
  if (Math.abs(d) < 0.001) return 'flat';
  return d > 0 ? 'up' : 'down';
}
function chgStr(v, base, unit) {
  if (base == null || v == null) return '<span class="flat">-</span>';
  const d = v - base;
  const sign = d > 0 ? '+' : '';
  const cls = chgClass(v, base);
  const fmt = Math.abs(d) < 1 ? 3 : 1;
  return `<span class="${cls}">${sign}${d.toFixed(fmt)}</span>`;
}

// 차트
function makeLineChart(id, series, color) {
  if (!series || !series.length) return;
  const labels = series.map(p => p.d);
  const vals   = series.map(p => p.v);
  new Chart(document.getElementById(id), {
    type: 'line',
    data: { labels, datasets: [{ data: vals, borderColor: color,
      backgroundColor: 'transparent', borderWidth: 1.5,
      pointRadius: 0, tension: 0.2 }] },
    options: {
      responsive: true, maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => items[0].label.slice(0,7),
            label: item => ` ${item.parsed.y != null ? item.parsed.y.toFixed(2) : '-'}`
          }
        }
      },
      scales: {
        x: { ticks: { font:{size:8}, maxRotation:0, maxTicksLimit:6,
               callback: function(val, idx) {
                 const lbl = this.getLabelForValue(val);
                 return lbl ? lbl.slice(0,7) : '';
               }}, grid:{display:false} },
        y: { ticks: { font:{size:8}, callback: v => v.toFixed(2) }, grid:{color:'#f0f0f0'} }
      }
    }
  });
}
// 복합 라인 차트
function makeMultiLineChart(id, datasets) {
  const el = document.getElementById(id);
  if (!el || !datasets.length) return;
  const allDates = [...new Set(datasets.flatMap(ds => ds.series.map(p => p.d)))].sort();
  new Chart(el, {
    type: 'line',
    data: {
      labels: allDates,
      datasets: datasets.map(ds => {
        const map = Object.fromEntries(ds.series.map(p => [p.d, p.v]));
        return {
          label: ds.label,
          data: allDates.map(d => map[d] != null ? map[d] : null),
          borderColor: ds.color, backgroundColor: 'transparent',
          borderWidth: 1.8, pointRadius: 0, tension: 0.2,
          spanGaps: true
        };
      })
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { font:{size:9}, boxWidth:10 } },
        tooltip: {
          callbacks: {
            title: items => items[0].label.slice(0,7),
            label: item => ` ${item.dataset.label}: ${item.parsed.y != null ? item.parsed.y.toFixed(2) : '-'}`
          }
        }
      },
      scales: {
        x: { ticks:{font:{size:8}, maxTicksLimit:7, maxRotation:0,
               callback: function(val, idx) {
                 const lbl = this.getLabelForValue(val);
                 return lbl ? lbl.slice(0,7) : '';
               }}, grid:{display:false} },
        y: { ticks:{font:{size:8}, callback: v => v.toFixed(2)}, grid:{color:'#f0f0f0'} }
      }
    }
  });
}

// Daily Macro Brief — 카테고리별 통합 집약
const newsEl = document.getElementById('news-section');
if (!DATA.news || !DATA.news.length) {
  newsEl.innerHTML = '<div style="color:#aaa;font-size:12px;padding:12px;">오늘 날짜 PDF 파일이 없습니다.</div>';
} else {
  // 모든 파일의 summary를 카테고리별로 통합
  const merged = {};
  DATA.news.forEach(item => {
    Object.entries(item.summary).forEach(([cat, sents]) => {
      if (!merged[cat]) merged[cat] = [];
      sents.forEach(s => {
        // 중복 문장 제거
        if (!merged[cat].some(existing =>
          existing.length > 0 && s.length > 0 &&
          [...s].filter(c => existing.includes(c)).length / s.length > 0.6
        )) {
          merged[cat].push(s);
        }
      });
    });
  });

  const CAT_ORDER = ['금리', '환율', '경기·물가'];
  const cats = CAT_ORDER.filter(c => merged[c]);
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="brief-grid">
    ${cats.map(cat => `
      <div class="brief-card">
        <div class="brief-cat">${cat}</div>
        <div class="brief-sentences">
          ${merged[cat].slice(0,6).map(s =>
            `<div class="brief-sent">${s.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`
          ).join('')}
        </div>
      </div>`).join('')}
  </div>`;
  newsEl.appendChild(wrap);
}
</script>
